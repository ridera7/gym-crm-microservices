spring:
  jpa:
    properties:
      hibernate:
        show-sql: true
        format_sql: true
  activemq:
    broker-url: ${BROKER_URL:tcp://localhost:61616}
    user: ${BROKER_USER:gcauser}
    password: ${BROKER_PASSWORD:gcapass}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO